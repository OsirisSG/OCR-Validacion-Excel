<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Versuchsmatrix</title>
  <meta name="description" content="OCR Versuchsmatrix · revisión, consolidación y exportación de pruebas." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="estilos.css?v=20260920-v8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='5' width='24' height='22' rx='5' fill='%232563eb'/><path d='M9 11h14M9 16h10M9 21h7' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>" />
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/htm.umd.js"></script>
</head>
<body>
  <div id="raiz"></div>
  <script>
    window.addEventListener("error", (evento) => {
      const raiz = document.getElementById("raiz");
      if (raiz && !raiz.textContent.trim()) {
        const principal = document.createElement("main");
        principal.className = "contenedor";
        const aviso = document.createElement("div");
        aviso.className = "estado-vacio estado-error";
        const titulo = document.createElement("h2");
        titulo.textContent = "No se pudo iniciar la interfaz";
        const mensaje = document.createElement("p");
        mensaje.textContent = evento.message;
        aviso.append(titulo, mensaje);
        principal.append(aviso);
        raiz.replaceChildren(principal);
        console.error(evento.error || evento.message);
      }
    });
  </script>
  <script src="i18n.js?v=20260920-v8"></script>
  <script src="app.js?v=20260920-v8"></script>
</body>
</html>
