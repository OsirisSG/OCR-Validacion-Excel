# =============================================================================
# config.yaml — Parámetros configurables del pipeline (Fases 0-3) y del dashboard.
# Fuente única de parámetros: nada de estos valores está hardcodeado en el código.
# Los valores "por defecto" de cada parámetro abierto del Documento Maestro
# (sección 10) se registran aquí y en docs/ de cada fase.
# =============================================================================

fase0:
  # Extensiones reconocidas por categoría (minúsculas, con punto).
  extensiones_imagen: [.jpg, .jpeg, .png, .bmp, .tif, .tiff, .webp]
  extensiones_video: [.mp4, .avi, .mov, .mkv, .wmv]
  # Mínimo de carpetas que deben compartir un patrón para declararlo dominante.
  min_carpetas_para_patron: 2
  # Nombre del artefacto de salida (relativo a la raíz del proyecto).
  archivo_salida: estructura_detectada.json

fase1:
  # EasyOCR es el único motor requerido y soportado por la instalación actual.
  # Su propia instancia cambia de CUDA/MPS a CPU si el acelerador falla.
  motor: easyocr
  motor_fallback: null
  # auto selecciona CUDA, después MPS (Apple Silicon) y finalmente CPU.
  dispositivo: auto
  rendimiento:
    hilos_cpu: null       # null = todos menos uno para mantener responsiva la UI
    batch_gpu: 4
    batch_cpu: 1
    workers_easyocr: 0   # un Reader compartido; evita duplicar VRAM/RAM
  lang: en                # el texto es nomenclatura alfanumérica, no lenguaje natural
  # Restringe EasyOCR al dominio de códigos y reduce confusiones con símbolos.
  caracteres_permitidos: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_/"
  umbral_confianza: 0.50  # tokens por debajo se descartan
  # Para transcripción completa se conserva más texto; los códigos usados en
  # decisiones mantienen el umbral estricto anterior.
  umbral_confianza_texto_completo: 0.25
  extraer_texto_completo: true
  umbral_espacio_px: 40   # PARÁMETRO ABIERTO (doc §10.3): separación mínima en px
                          # entre cajas para considerar tokens distintos en una fila.
  preprocesamiento:
    activar: true
    deskew: true                    # corrige rotación fina (±15°)
    angulo_minimo_correccion: 2.0   # grados; por debajo no rota (evita ruido)
    variante_principal: original    # mejor para fotos reales; adaptativa queda como respaldo
    binarizacion_adaptativa: true
    binarizacion_blocksize: 51      # debe ser impar
    binarizacion_c: 15
    # Realce para texto con poco contraste o grabado/moldeado sobre plástico.
    clahe_clip_limit: 3.0
    clahe_grid_size: 8
    relieve_kernel: 9
    regiones_texto:
      activar: true
      max_regiones: 6
      umbral_confianza: 0.20
      altura_objetivo_px: 220
      escala_max: 3.0
      agrupacion_horizontal_divisor: 25
      agrupacion_vertical_divisor: 200
      margen_horizontal_factor: 0.80
      margen_vertical_factor: 0.80
      bono_puntuacion: 0.35
    busqueda_adaptativa:
      # "adaptativo": una pasada normal; solo amplía la búsqueda cuando no
      # encuentra un código alfanumérico con confianza suficiente.
      # "exhaustivo": prueba todas las combinaciones (más lento).
      modo: adaptativo
      orientaciones: [0, 90, 180, 270]
      variantes_respaldo: [adaptativa, clahe, relieve]
      confianza_codigo_suficiente: 0.70
  qr:
    # OpenCV detecta y decodifica localmente; una URL se conserva como texto y
    # nunca se abre. Los alias opcionales sólo pueden apuntar a claves estables.
    detector: cv2
    lado_maximo_deteccion: 1400
    escala_respaldo: 2.0
    aliases: {}
    # Validación de candidatos a QR: cuadratura y tamaño relativo a la imagen.
    ratio_cuadrado_min: 0.70
    ratio_cuadrado_max: 1.30
    tamano_min_px: 40
    tamano_max_frac: 0.60   # fracción del lado mayor de la imagen
    # Factor de expansión del ROI alrededor del QR (1.0 = solo el QR).
    # El texto no tiene posición fija respecto al QR: margen amplio + política
    # conservadora (roi_frac_minima) + reintento anti-truncamiento. Con 0.90 el
    # ROI solo recorta márgenes vacíos evidentes, nunca contenido potencial.
    margen_roi_factor: 3.0
    roi_frac_minima: 0.90            # el ROI nunca deja <90% del ancho/alto de la imagen
    reintentar_imagen_completa: true  # texto tocando borde del ROI o ROI vacío → imagen completa

fase2:
  procesar_videos: false  # reservado para una fase futura; hoy solo se inventarían como ignorados
  # Densidad de texto (área de bboxes / área de imagen) mínima para que una
  # imagen sea considerada "candidato a imagen de referencia".
  # PARÁMETRO ABIERTO (doc §10.2): la heurística de densidad es la regla v1;
  # sustituible por regla de nombre de archivo sin tocar el resto del código.
  umbral_densidad_texto: 0.010
  # La candidata por densidad debe superar por este factor a la segunda mejor;
  # si no hay ganador claro (dos fotos igual de "textosas"), se declara
  # sin_referencia en vez de adivinar. Además se exigen >= 2 imágenes.
  ventaja_minima_referencia: 1.5
  # Comparar solo tokens tipo código (con dígitos): 'ETQ-2024-A1-V2' sí,
  # 'PRUEBA DE ETIQUETA' no (lenguaje natural, no forma parte del contrato).
  comparar_solo_tokens_codigo: true
  # Palabras en el nombre de archivo que marcan referencia directamente
  # (si se activa, tiene prioridad sobre la densidad de texto).
  usar_pista_nombre: true
  palabras_pista_referencia: [ref, referencia, info, info_referencia]
  # Estrategia para elegir la foto de etiqueta cuando hay varias:
  # "mejor_confianza" (la foto con OCR más confiable) o "primera" (orden alfabético).
  estrategia_etiqueta: mejor_confianza
  # Ratio de coincidencia (tokens de etiqueta presentes en referencia):
  # 1.0 -> coincidencia_total; >0 y <1 -> parcial; 0 -> discrepancia.
  umbral_coincidencia_total: 1.0
  # Comparación insensible a mayúsculas y a separadores (-, _, espacios).
  normalizar_tokens: true

fase3:
  archivo_salida: resultado_maestro.xlsx
  # Una ruta fija sigue siendo una anulación opcional para CLI. El dashboard
  # detecta la plantilla por estructura y, si no encuentra una compatible, usa
  # el generador integrado sin detener el procesamiento.
  plantilla_empresarial: null
  deteccion_plantillas:
    activar: true
    directorios: [plantillas]
    estrategias:
      - nombre: empresarial_1st_2st
        perfiles: [empresarial]
        tipos_st: [1ST, 2ST]
        marcadores_ruta: []
        patrones_archivo: ["*plantilla*.xlsx", "*captura*.xlsx", "*template*.xlsx"]
  registro_plantillas:
    directorio: .plantillas
  hoja_estructura: "Estructura completa"
  hoja_matriz: "Matriz de cumplimiento"
  hoja_textos: "Textos por imagen"
  hoja_revision: "Bandeja de revisión"

# Flujo por ID para proyectos con <ID> <VERSION> <INFLADOR> <TEMPERATURA>.
empresarial:
  archivo_cache: .cache_ocr/imagenes.sqlite3
  archivo_cache_legacy: .cache_ocr/imagenes_legacy.sqlite3
  archivo_avance_ids: .cache_ocr/avances_ids.json
  base_conocimiento: base_conocimiento.json
  reglas_minimo_ids: 3
  reglas_consenso_minimo: 0.90

ocr:
  modo_recorte: auto       # auto | manual | completo
  detectar_texto_antes_ocr: true
  lado_maximo_deteccion: 1280
  margen_recorte: 0.12
  zoom_minimo: 1.0
  zoom_maximo: 3.0
  altura_objetivo_recorte: 160
  corregir_perspectiva: true
  rotacion_fallback: true
  confianza_fallback: 0.45
  roi_manual:
    NACH: {x: 0.00, y: 0.50, ancho: 1.00, alto: 0.50}
    VOR: {x: 0.00, y: 0.40, ancho: 1.00, alto: 0.60}

normalizacion:
  temperature_condition:
    HT: {codigos: [HT], temperaturas_c: [85], tolerancia_c: 2}
    RT: {codigos: [RT], temperaturas_c: [23], tolerancia_c: 2}
    NT: {codigos: [NT], temperaturas_c: [-35], tolerancia_c: 2}
  module_version:
    RDW: {aliases: [RDW, RWD, ROW]}
    NAR: {aliases: [NAR, N4R]}

# Aprendizaje local y auditable. Las ejecuciones registran observaciones, pero
# solo una corrección humana confirmada puede entrenar una versión candidata.
aprendizaje:
  activar: true
  directorio: .aprendizaje
  registrar_observaciones: true
  aplicar_modelo: true
  promocion_automatica: false
  # Una lectura exacta debe corregirse igual en imágenes distintas al menos dos
  # veces antes de convertirse en regla automática.
  minimo_soporte_exacto: 2
  minimo_soporte_caracter: 3
  minimo_soporte_patron: 2
  dominancia_minima: 0.80
  # Desde este volumen se reserva automáticamente 20% de imágenes como holdout.
  minimo_correcciones_validacion: 20
  visual:
    # Entrenamiento real del reconocedor CTC de EasyOCR. CRAFT no se modifica.
    minimo_muestras: 100
    minimo_ids: 15
    proporcion_validacion: 0.20  # separación por ID, nunca por recorte aleatorio
    epocas: 3
    batch: 8
    learning_rate: 0.00001
    alto: 64
    ancho: 320
    max_longitud: 64

# Banco local de imágenes difíciles. Se mantiene fuera de Git porque las
# fuentes externas pueden no autorizar su redistribución.
pruebas_externas:
  directorio: .pruebas_externas/embossed-text-reader/images
  archivo_resultados: .pruebas_externas/resultados.json

# Paleta del semáforo: MISMO hex en Excel y dashboard (doc §6, requisito visual).
# El backend la expone en GET /api/config para que el frontend no la duplique.
colores:
  verde: "#22c55e"
  amarillo: "#f59e0b"
  rojo: "#ef4444"

dashboard:
  # Raíz permitida para servir imágenes originales en el detalle (seguridad:
  # el backend rechaza rutas fuera de esta raíz).
  raiz_datos_permitida: null   # null -> se toma del último pipeline ejecutado
  puerto: 8000
